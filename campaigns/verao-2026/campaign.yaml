# campaign.yaml — RASCUNHO gerado a partir da leitura do KV-mestre (inputs/kv/kv.psd).
# Referência de asset: "kv.psd#<índice do layer>" (ordem de baixo para cima no PSD).
# Status "rascunho" até a confirmação do mapeamento de papéis (desdobrador confirm, M2).
slug: verao-2026
brand: tumelero
nome: Verão
status: rascunho
proprietaria: true
phases: [verao]
extra_colors: []
cubo_arte: continua
roles:
  # Layers 0 (pixel) + 1 (smart object "Expansão generativa", PSB 4330×2436): foto única
  # com o mascote, o cortador e o cenário. Fundo e imagem principal estão fundidos.
  fundo:
    file: "kv.psd#1"
    extensible: true
  imagem_principal:
    file: "kv.psd#1"
    focal_point: [0.53, 0.30]       # rosto/capacete do mascote (x, y relativos ao KV)
  elementos_apoio:
    - { file: "kv.psd#2", nome: faixa azul inferior (#072BAB, 100% da largura, ~27% da altura), recortavel: true }
  gimmick: null
  lettering:
    horizontal: "kv.psd#3"          # "VERÃO" — vetor do Illustrator com 3D/contorno laranja
    vertical: null                  # não existe → derivar empilhado ou pedir arquivo
  conceito_tipografico:
    file: "kv.psd#4"
    text: "Dias de sol, casa renovada e muitas ofertas."
    style: Objektiv Mk3 Black, caixa alta, tracking 25, branco
  logo: { auto: true, slogan: false, kv_ref: "kv.psd#5" }   # cliente (19/11): não aplicar o slogan nesta campanha
  produtos: []
  selos: []
copy:
  titulo: "VERÃO"
  subtitulo: "Dias de sol, casa renovada e muitas ofertas."
  cta: null
  contexto: null
regras_composicao:
  # Orientação do cliente (19/11): lonas maiores = bloco azul do KV + foto aplicada num canto.
  # Seleção inicial = lonas ultra-horizontais (> 4:1). 250x260 e 420x130 seguem com a foto (a confirmar).
  - nome: "lonas grandes: bloco azul + foto no canto"
    formatos: [lona-300x70, lona-400x70, lona-470x90, lona-600x70, lona-800x80, lona-800x100]
    fundo: { cor: azul }
    imagem_principal: canto        # foto aplicada num canto do bloco azul (orientação 19/11)
    canto: esquerda                # logo fica na ponta direita (MIV: logo H na ponta)
    foto_largura: 0.42             # fração da largura da lona (limitada a 3:1, o que a foto oferece)
    textos: [lettering, conceito, logo]   # conceito em texto entra por orientação do cliente (exceção à regra de 7 palavras)
    lockup: livre                  # VERÃO pode avançar sobre a foto (cliente, 19/11)
    foto_origem: assets/foto_cena_expandida_adobe.png   # cena expandida para 4,7:1 com Adobe Generative Expand
    confirmado: false
pendencias:
  - Lettering vertical inexistente (necessário para triedro, big tower, pedágio, parallax mobile)
  - "Foto única — separar mascote/cortador do cenário (recorte) para reposicionar nos formatos extremos"
  - CTA e ofertas/produtos/selos não constam no KV
